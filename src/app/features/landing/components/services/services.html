<section
  id="servicios"
  class="services-section"
  aria-labelledby="services-title"
>
  <div class="services-container">

    <header class="services-header">
      <p class="services-eyebrow">
        <span aria-hidden="true"></span>
        NUESTROS SERVICIOS
      </p>

      <h2 id="services-title" class="services-title">
        El cuidado que
        <span>tu sonrisa merece.</span>
      </h2>

      <p class="services-description">
        Tratamientos para cuidar tu salud bucal con
        atención profesional y personalizada.
      </p>
    </header>

    <div
      class="tooth-stage"
      role="img"
      aria-label="Diente cerámico con órbitas doradas"
    >
      <div class="tooth-motion">
        <img
          class="tooth-frame"
          src="/assets/touch/01-tooth-front.webp"
          alt=""
          width="512"
          height="512"
          loading="eager"
          decoding="async"
          draggable="false"
        >
      </div>
    </div>

    <div class="service-list">
      @for (service of services; track service.number) {
        <article
          class="service-item"
          [attr.aria-labelledby]="'service-title-' + service.number"
        >
          <div class="service-heading">
            <span class="service-number" aria-hidden="true">
              {{ service.number }}
            </span>

            <span class="service-icon" aria-hidden="true">
              <svg
                viewBox="0 0 32 32"
                fill="none"
                focusable="false"
              >
                @for (path of service.paths; track $index) {
                  <path [attr.d]="path"></path>
                }
              </svg>
            </span>
          </div>

          <div class="service-copy">
            <h3 [id]="'service-title-' + service.number">
              {{ service.name }}
            </h3>

            <p>{{ service.description }}</p>
          </div>
        </article>
      }
    </div>

    <footer class="services-footer">
      <a class="services-cta" href="#contacto">
        <span>Agenda una valoración</span>

        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M5 12h14m-6-6 6 6-6 6"></path>
        </svg>
      </a>
    </footer>

  </div>
</section>
