<section
  id="beneficios"
  class="benefits-section"
  aria-labelledby="benefits-title"
>
  <div class="benefits-container">

    <!-- =========================================
         ENCABEZADO
    ========================================== -->
    <header class="benefits-header">

      <div class="section-label">
        <span class="label-line"></span>

        <span>POR QUÉ ELEGIRNOS</span>

        <span class="label-line"></span>
      </div>

    </header>


    <!-- =========================================
         BLOQUE PRINCIPAL
    ========================================== -->
    <div class="benefits-intro">

      <!-- TEXTO -->
      <div class="intro-content">

        <h2 id="benefits-title">
          Cuidado en
          <span>cada detalle.</span>
        </h2>

        <p>
          Tu bienestar y confianza son nuestra prioridad.
          Por eso, te ofrecemos una atención odontológica
          completa, profesional y humana.
        </p>

      </div>


      <!-- IMAGEN -->
      <div class="intro-image">

        <img
          src="assets/consultorio/janerdent-consultorio-real.webp"
          alt="Interior del consultorio dental JANER DENT"
        />

      </div>

    </div>


    <!-- =========================================
         DIVISOR
    ========================================== -->
    <div class="section-divider"></div>


    <!-- =========================================
         BENEFICIOS
    ========================================== -->
    <div class="benefits-grid">

      @for (item of benefits; track item.number) {

        <article class="benefit-item">

          <div class="benefit-number">
            {{ item.number }}
          </div>


          <div class="benefit-info">

            <h3>
              {{ item.title }}
            </h3>

            <p>
              {{ item.description }}
            </p>

          </div>

        </article>

      }

    </div>

  </div>
</section>
