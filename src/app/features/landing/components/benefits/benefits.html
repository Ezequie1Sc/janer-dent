<section
  id="beneficios"
  class="benefits-section"
  #benefitsSection
  aria-labelledby="benefits-title"
>
  <div class="benefits-container">

    <!-- =========================================
         PARTE SUPERIOR
    ========================================== -->

    <div class="benefits-hero">

      <!-- COLUMNA IZQUIERDA -->
      <div class="benefits-heading">

        <div class="section-label">
          <span class="label-line"></span>
          <span>POR QUÉ ELEGIRNOS</span>
          <span class="label-line"></span>
        </div>

        <h2 id="benefits-title">
          Una experiencia
          <br>
          odontológica
          <br>
          <span>diferente.</span>
        </h2>

        <div class="heading-decoration"></div>

      </div>


      <!-- IMAGEN -->
      <div class="benefits-visual">

        <div class="visual-image">

          <img
            src="assets/consultorio/janerdent-consultorio-real.webp"
            alt="Interior del consultorio dental JANER DENT"
          />

          <div class="visual-overlay"></div>

          <span class="visual-label">
            JANER
          </span>

        </div>

      </div>


      <!-- TEXTO LATERAL -->
      <div class="benefits-aside">

        <span class="aside-line"></span>

        <p>
          Cada detalle de nuestro espacio está pensado para
          que te sientas cómodo desde el primer momento.
        </p>

        <a
          href="#contacto"
          class="aside-link"
        >
          Conoce nuestra atención

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M5 12h13"></path>
            <path d="m13 6 6 6-6 6"></path>
          </svg>
        </a>

      </div>

    </div>


    <!-- =========================================
         BENEFICIOS
    ========================================== -->

    <div class="benefits-grid">

      @for (item of benefits; track item.number) {

        <article
          class="benefit-item"
          [attr.data-number]="item.number"
        >

          <div class="benefit-header">

            <span class="benefit-number">
              {{ item.number }}
            </span>

            <span class="benefit-line"></span>

          </div>


          <div class="benefit-content">

            <h3>
              {{ item.title }}
            </h3>

            <p>
              {{ item.description }}
            </p>

          </div>

        </article>

      }

    </div>

  </div>
</section>
